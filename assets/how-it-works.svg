<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Telegram to Rubika file flow">
  <title>Telegram → Bot → Rubika</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lbl  { fill: #f1f1f3; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
      .sub  { fill: #85858b; font-size: 12.5px; }
      .num  { fill: #0b0b0c; font-size: 13px; font-weight: 800; }
    </style>
  </defs>

  <rect width="900" height="290" rx="26" fill="url(#bg)"/>
  <rect width="900" height="290" rx="26" fill="url(#dots)"/>
  <rect x=".75" y=".75" width="898.5" height="288.5" rx="25.5" fill="none" stroke="#2b2b30" stroke-width="1.5"/>

  <!-- connectors -->
  <g fill="none" stroke-linecap="round">
    <line x1="170" y1="130" x2="372" y2="130" stroke="#2c2c31" stroke-width="3"/>
    <line x1="528" y1="130" x2="730" y2="130" stroke="#2c2c31" stroke-width="3"/>
    <line x1="170" y1="130" x2="372" y2="130" stroke="#d9d9de" stroke-width="2.4" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="528" y1="130" x2="730" y2="130" stroke="#d9d9de" stroke-width="2.4" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- pulse rings -->
  <g fill="none" stroke="#ffffff">
    <circle cx="125" cy="130" r="50" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="48;78" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="775" cy="130" r="50" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="48;78" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- node: Telegram -->
  <g>
    <rect x="80" y="85" width="90" height="90" rx="26" fill="url(#node)" stroke="#e9e9ee" stroke-width="1.6"/>
    <g transform="translate(125 130)" fill="#f4f4f6">
      <path d="M-22 -2 L23 -20 C25 -21 27 -19 26 -17 L17 22 C16 25 13 26 11 24 L-1 15 L-9 23 C-10.5 24.5 -13 23.5 -13 21.5 L-13 9 L18 -13 L-16 6 L-21.5 3.5 C-24 2.5 -24.5 -1 -22 -2 Z"/>
    </g>
  </g>

  <!-- node: Bot -->
  <g>
    <rect x="372" y="72" width="156" height="116" rx="28" fill="url(#node)" stroke="#e9e9ee" stroke-width="1.6"/>
    <!-- antenna -->
    <line x1="450" y1="72" x2="450" y2="58" stroke="#e9e9ee" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="450" cy="53" r="5" fill="#f4f4f6">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- lock -->
    <g transform="translate(450 112)">
      <rect x="-15" y="-4" width="30" height="24" rx="6" fill="#f4f4f6">
        <animate attributeName="opacity" values="1;.55;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <path d="M-8 -4 V-11 A8 8 0 0 1 8 -11 V-4" fill="none" stroke="#f4f4f6" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="3" fill="#0b0b0c"/>
    </g>
    <!-- mini progress bar -->
    <rect x="402" y="158" width="96" height="7" rx="3.5" fill="#2c2c31"/>
    <rect x="402" y="158" width="0" height="7" rx="3.5" fill="#f1f1f3">
      <animate attributeName="width" values="0;96;96" keyTimes="0;.8;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- node: Rubika -->
  <g>
    <rect x="730" y="85" width="90" height="90" rx="26" fill="url(#node)" stroke="#e9e9ee" stroke-width="1.6"/>
    <text x="775" y="146" text-anchor="middle" fill="#f4f4f6" font-size="44" font-weight="800">R</text>
  </g>

  <!-- labels -->
  <text x="125" y="218" text-anchor="middle" class="lbl">Telegram</text>
  <text x="125" y="238" text-anchor="middle" class="sub">files &amp; links</text>
  <text x="450" y="218" text-anchor="middle" class="lbl">Bot</text>
  <text x="450" y="238" text-anchor="middle" class="sub">7z · AES-256 · split</text>
  <text x="775" y="218" text-anchor="middle" class="lbl">Rubika</text>
  <text x="775" y="238" text-anchor="middle" class="sub">Saved Messages</text>
  <text x="271" y="112" text-anchor="middle" class="sub">download</text>
  <text x="629" y="112" text-anchor="middle" class="sub">95 MB parts</text>

  <!-- files: Telegram -> Bot -->
  <g>
    <g opacity="0">
      <animateMotion path="M170,130 L372,130" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="0s" repeatCount="indefinite"/>
      <path d="M-11 -14 H4 L11 -7 V14 H-11 Z" fill="#f4f4f6"/>
      <path d="M4 -14 V-7 H11" fill="none" stroke="#111" stroke-width="1.6"/>
    </g>
    <g opacity="0">
      <animateMotion path="M170,130 L372,130" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="1s" repeatCount="indefinite"/>
      <path d="M-11 -14 H4 L11 -7 V14 H-11 Z" fill="#f4f4f6"/>
      <path d="M4 -14 V-7 H11" fill="none" stroke="#111" stroke-width="1.6"/>
    </g>
    <g opacity="0">
      <animateMotion path="M170,130 L372,130" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="2s" repeatCount="indefinite"/>
      <path d="M-11 -14 H4 L11 -7 V14 H-11 Z" fill="#f4f4f6"/>
      <path d="M4 -14 V-7 H11" fill="none" stroke="#111" stroke-width="1.6"/>
    </g>
  </g>

  <!-- parts: Bot -> Rubika -->
  <g>
    <g opacity="0">
      <animateMotion path="M528,130 L730,130" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      <rect x="-13" y="-13" width="26" height="26" rx="7" fill="#f4f4f6"/>
      <text x="0" y="5" text-anchor="middle" class="num">1</text>
    </g>
    <g opacity="0">
      <animateMotion path="M528,130 L730,130" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      <rect x="-13" y="-13" width="26" height="26" rx="7" fill="#f4f4f6"/>
      <text x="0" y="5" text-anchor="middle" class="num">2</text>
    </g>
    <g opacity="0">
      <animateMotion path="M528,130 L730,130" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      <rect x="-13" y="-13" width="26" height="26" rx="7" fill="#f4f4f6"/>
      <text x="0" y="5" text-anchor="middle" class="num">3</text>
    </g>
  </g>
</svg>
